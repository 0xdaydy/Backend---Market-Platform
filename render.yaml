# render.yaml — Render Blueprint for Market Platform API
# ======================================================
# Deploy:
#   1. Push this repo to GitHub
#   2. Connect repo in Render Dashboard > Blueprints
#   3. Run: render blueprint validate && render blueprint launch
#
# Database note: Render provides managed Postgres, not MySQL.
# This blueprint uses pgsql. Laravel supports Postgres natively.
# If you must use MySQL, provision externally (PlanetScale, Aiven)
# and override DB_CONNECTION + DB_* env vars manually.

services:
  - type: web
    name: market-platform-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Laravel ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: market-platform-api
          property: host
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_FAKER_LOCALE
        value: fr_FR

      # --- Logging ---
      - key: LOG_LEVEL
        value: warning
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single

      # --- Database (Render Postgres) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-d7s083ho3t8c73dg5pvg-a.oregon-postgres.render.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: market_platform
      - key: DB_USERNAME
        value: market_platform_user
      - key: DB_PASSWORD
        value: tsLGJulADBTi9BURYJdGiVf5sKJNWKSy

      # --- Session / Cache / Queue ---
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database

      # --- App-specific ---
      - key: DEFAULT_CREDIT_LIMIT
        value: "50000"
      - key: INTEREST_RATE
        value: "0.05"

      # --- Mail ---
      - key: MAIL_MAILER
        value: log

# Database provisioned via API: dpg-d7s083ho3t8c73dg5pvg-a (oregon, free tier)
# Connection details set as explicit env vars above
