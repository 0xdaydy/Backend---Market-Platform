version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - market-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: market-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: market_platform
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: market
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - market-network

  nginx:
    image: nginx:alpine
    container_name: market-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - market-network

volumes:
  mysql-data:

networks:
  market-network:
    driver: bridge
